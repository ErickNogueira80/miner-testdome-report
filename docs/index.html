<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultado de avaliação de candidato</title>
<link rel="stylesheet" href="static/css/report.css">
</head>
<body>

<div class="report-header">
  <div class="brand"><img src="static/img/miner-logo-branco.svg" alt="Miner"></div>
  <div>
    <div class="eyebrow">Testdome &middot; Avaliação técnica</div>
    <div class="title">Resultado de avaliação de candidato</div>
  </div>
</div>
<div class="subnav">
  <a href="index.html" class="active">Avaliações individuais</a>
  <a href="gerencial.html" class="">Painel gerencial</a>
</div>

<div class="page">
<div class="layout">
  <div class="main-col" id="candidate-main">
    <p class="footnote">Carregando dados...</p>
  </div>

  <aside class="filter-panel">
    <p class="filter-title">Nome do candidato</p>
    <input type="text" id="candidate-search" class="filter-search" placeholder="Pesquisar">
    <div class="filter-list" id="filter-list"></div>
    <p class="filter-empty" id="filter-empty" style="display:none;">Nenhum candidato encontrado.</p>
    <label class="filter-note"><input type="checkbox" checked disabled> Requer seleção única</label>
  </aside>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="static/js/testdome-data.js"></script>
<script>
(function () {
  var candidates = [];

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderCandidateBody(c) {
    var skillRow = c.resumo_skills.map(function (s) {
      return (
        '<div class="skill-card">' +
        '<span class="skill-name">' + escapeHtml(s.nome) + '</span>' +
        '<span class="pill ' + s.tone + '">' + s.percentual + '%</span>' +
        '</div>'
      );
    }).join("");

    var rows = c.detalhamento.map(function (d, i) {
      return (
        '<tr>' +
        '<td>' + (i + 1) + '</td>' +
        '<td>' + escapeHtml(d.conhecimento) + '</td>' +
        '<td>' + escapeHtml(d.pergunta) + '</td>' +
        '<td>' + escapeHtml(d.senioridade) + '</td>' +
        '<td>' + escapeHtml(d.tipo) + '</td>' +
        '<td>' + d.peso + '%</td>' +
        '<td class="score ' + d.tone + '">' + d.pontuacao + '%</td>' +
        '<td>' + escapeHtml(d.observacao) + '</td>' +
        '</tr>'
      );
    }).join("");

    return (
      '<div class="candidate-body active" data-id="' + c.id + '">' +
      '<div class="id-row">' +
        '<div class="id-block"><p class="eyebrow">Candidato</p><p class="name">' + escapeHtml(c.nome) + '</p></div>' +
        '<div class="id-block align-right"><p class="eyebrow">Avaliação</p><p class="name">' + escapeHtml(c.nome_teste) + '</p></div>' +
      '</div>' +
      '<div class="stat-row">' +
        '<div class="card"><p class="label">Percentual de acerto</p><p class="value"><span class="pill ' + c.percentual_tone + '">' + c.percentual_geral + '%</span></p></div>' +
        '<div class="card"><p class="label">Data da avaliação</p><p class="value" style="font-size: var(--text-h3);">' + escapeHtml(c.data_avaliacao) + '</p></div>' +
        '<div class="card"><p class="label">Tempo de prova</p><p class="value" style="font-size: var(--text-h3);">' + escapeHtml(c.tempo_prova) + '</p></div>' +
      '</div>' +
      '<p class="section-title">Resumo por conhecimento técnico</p>' +
      '<div class="skill-row">' + skillRow + '</div>' +
      '<p class="section-title">Detalhamento por pergunta</p>' +
      '<div class="table-wrap"><table class="detail"><thead><tr>' +
        '<th>#</th><th>Conhecimento Técnico</th><th>Pergunta</th><th>Senioridade</th>' +
        '<th>Tipo de Pergunta</th><th>Peso</th><th>Pontuação</th><th>Observação</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="footnote">Essa avaliação não substitui qualquer entrevista feita ou a ser realizada.</p>' +
      '</div>'
    );
  }

  function selectCandidate(id) {
    var c = candidates.find(function (x) { return String(x.id) === String(id); });
    if (!c) return;
    document.querySelectorAll(".filter-item").forEach(function (it) {
      it.classList.toggle("selected", String(it.dataset.id) === String(id));
    });
    document.getElementById("candidate-main").innerHTML = renderCandidateBody(c);
    document.title = "Resultado de avaliação de candidato — " + c.nome;
  }

  function renderFilterList(list) {
    var container = document.getElementById("filter-list");
    container.innerHTML = list.map(function (c) {
      return (
        '<label class="filter-item" data-id="' + c.id + '" data-name="' + escapeHtml(c.nome) + '">' +
        '<input type="radio" name="candidato" value="' + c.id + '">' +
        escapeHtml(c.nome) +
        '</label>'
      );
    }).join("");
    container.querySelectorAll(".filter-item").forEach(function (it) {
      it.addEventListener("click", function () { selectCandidate(it.dataset.id); });
    });
  }

  function wireSearch() {
    var search = document.getElementById("candidate-search");
    var emptyMsg = document.getElementById("filter-empty");
    search.addEventListener("input", function () {
      var q = search.value.trim().toLowerCase();
      var any = false;
      document.querySelectorAll(".filter-item").forEach(function (it) {
        var match = it.dataset.name.toLowerCase().indexOf(q) !== -1;
        it.style.display = match ? "" : "none";
        if (match) any = true;
      });
      emptyMsg.style.display = any ? "none" : "";
    });
  }

  async function init() {
    try {
      var rows = await loadRows();
      candidates = buildCandidates(rows);
      renderFilterList(candidates);
      wireSearch();
      if (candidates.length) selectCandidate(candidates[0].id);
      else document.getElementById("candidate-main").innerHTML = '<p class="footnote">Nenhum candidato encontrado no CSV.</p>';
    } catch (err) {
      document.getElementById("candidate-main").innerHTML = '<p class="footnote">Erro ao carregar dados: ' + escapeHtml(err.message) + '</p>';
    }
  }

  init();
})();
</script>
</body>
</html>
