<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultado de avaliação de candidato — nova visão</title>
<link rel="stylesheet" href="static/css/report.css?v=15">
</head>
<body>

<div class="report-header">
  <div class="brand"><img src="static/img/miner-logo-branco.svg" alt="Miner"></div>
  <div class="title-block">
    <div class="eyebrow">Avaliação técnica</div>
    <div class="title">Resultado de avaliação de candidato</div>
  </div>
</div>

<div class="print-header">
  <img src="static/img/miner-logo-petroleo.svg" alt="Miner">
</div>

<div class="shell">
  <button type="button" id="nav-toggle" class="nav-toggle" aria-label="Recolher menu" title="Recolher menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <aside class="side-nav">
    <nav class="side-nav-links">
      <a href="gerencial.html" class="side-nav-link">Painel gerencial</a>
      <a href="index.html" class="side-nav-link">Avaliações individuais</a>
      <a href="avaliacao-v2.html" class="side-nav-link active">Nova visão (beta)</a>
    </nav>
    <hr class="side-nav-divider">
    <p class="filter-title">Nome do candidato</p>
    <input type="text" id="candidate-search" class="filter-search" placeholder="Pesquisar">
    <select id="candidate-select" class="filter-select"></select>
    <button type="button" id="print-btn" class="btn-print">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 6 2 18 2 18 9"></polyline>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
        <rect x="6" y="14" width="12" height="8"></rect>
      </svg>
      Imprimir
    </button>
    <p class="filter-empty" id="filter-empty" style="display:none;">Nenhum candidato encontrado.</p>
  </aside>

  <div class="page">
    <div id="candidate-main">
      <p class="footnote">Carregando dados...</p>
    </div>
  </div>
</div>

<script src="static/js/nav-toggle.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="static/js/testdome-data.js?v=4"></script>
<script>
(function () {
  var candidates = [];

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderTabela(titulo, colunaLabel, agregado) {
    var linhasHtml = agregado.linhas.map(function (l) {
      return (
        '<tr>' +
          '<td>' + escapeHtml(l.nome) + '</td>' +
          '<td class="num">' + fmtPontos(l.esperado) + '</td>' +
          '<td class="num">' + fmtPontos(l.realizado) + '</td>' +
          '<td class="num score ' + scoreTone(l.pct) + '">' + l.pct + '%</td>' +
        '</tr>'
      );
    }).join("");

    return (
      '<p class="section-title">' + escapeHtml(titulo) + '</p>' +
      '<div class="table-wrap perf-table"><table class="detail"><thead><tr>' +
        '<th>' + escapeHtml(colunaLabel) + '</th><th class="num">Pontos Esperados</th>' +
        '<th class="num">Pontos Realizados</th><th class="num">%</th>' +
      '</tr></thead><tbody>' + linhasHtml +
        '<tr class="total-row"><td>TOTAL</td>' +
        '<td class="num">' + fmtPontos(agregado.total.esperado) + '</td>' +
        '<td class="num">' + fmtPontos(agregado.total.realizado) + '</td>' +
        '<td class="num">' + agregado.total.pct + '%</td></tr>' +
      '</tbody></table></div>'
    );
  }

  function renderPerfil(perfil) {
    var notas = perfil.notasPorConteudo.map(function (n) {
      return (
        '<div class="skill-card with-note">' +
          '<div class="skill-card-row">' +
            '<span class="skill-name">' + escapeHtml(n.nome) + '</span>' +
            '<span class="pill ' + scoreTone(n.pct) + '">' + n.pct + '%</span>' +
          '</div>' +
          '<span class="skill-note">' + escapeHtml(n.nota) + '</span>' +
        '</div>'
      );
    }).join("");

    return (
      '<p class="section-title">Perfil resultante</p>' +
      '<div class="stat-row cols-2">' +
        '<div class="card"><p class="label">Perfil</p><p class="text">' + escapeHtml(perfil.titulo) + '</p></div>' +
        '<div class="card"><p class="label">Foco principal</p><p class="text">' + escapeHtml(perfil.foco) + '</p></div>' +
      '</div>' +
      '<div class="skill-row">' + notas + '</div>'
    );
  }

  function renderCandidateBody(c) {
    var d = buildDesempenho(c);

    return (
      '<div class="candidate-body active" data-id="' + c.id + '">' +
      '<div class="id-row">' +
        '<div class="id-block"><p class="eyebrow">Candidato</p><p class="name">' + escapeHtml(c.nome) + '</p></div>' +
        '<div class="id-block align-right"><p class="eyebrow">Avaliação</p><p class="name">' + escapeHtml(c.nome_teste) + '</p></div>' +
      '</div>' +
      '<div class="stat-row">' +
        '<div class="card"><p class="label">Percentual de acerto</p><p class="value"><span class="pill pill-lg ' + c.percentual_tone + '">' + c.percentual_geral + '%</span></p></div>' +
        '<div class="card"><p class="label">Data da avaliação</p><p class="value">' + escapeHtml(c.data_avaliacao) + '</p></div>' +
        '<div class="card"><p class="label">Tempo de prova</p><p class="value">' + escapeHtml(c.tempo_prova) + '</p></div>' +
      '</div>' +
      renderTabela("Desempenho por senioridade", "Senioridade", d.porSenioridade) +
      renderTabela("Desempenho por conhecimento técnico", "Conteúdo", d.porConteudo) +
      renderTabela("Desempenho por conteúdo e senioridade", "Conteúdo / Senioridade", d.cruzado) +
      renderPerfil(d.perfil) +
      '<p class="footnote">Nova visão em avaliação — consolida os resultados por senioridade e conhecimento técnico, além de uma leitura automática do perfil resultante (heurística baseada só nos percentuais; o CSV publicado não traz o texto das respostas). Essa avaliação não substitui qualquer entrevista feita ou a ser realizada.</p>' +
      '</div>'
    );
  }

  function selectCandidate(id) {
    var c = candidates.find(function (x) { return String(x.id) === String(id); });
    if (!c) return;
    document.getElementById("candidate-main").innerHTML = renderCandidateBody(c);
    document.title = "Resultado de avaliação de candidato — nova visão — " + c.nome;
  }

  /** Reconstrói as opções do <select> a partir de uma lista (já filtrada pela busca).
   * Mantém o candidato atualmente selecionado se ele ainda estiver na lista;
   * caso contrário, seleciona o primeiro resultado. Retorna o id escolhido,
   * ou null se a lista estiver vazia. */
  function populateSelect(list, preserveId) {
    var select = document.getElementById("candidate-select");
    var emptyMsg = document.getElementById("filter-empty");

    if (!list.length) {
      select.innerHTML = "";
      select.style.display = "none";
      emptyMsg.style.display = "";
      return null;
    }

    select.style.display = "";
    emptyMsg.style.display = "none";
    select.innerHTML = list.map(function (c) {
      return '<option value="' + c.id + '">' + escapeHtml(c.nome) + '</option>';
    }).join("");

    var keep = preserveId != null && list.some(function (c) { return String(c.id) === String(preserveId); });
    var chosenId = keep ? preserveId : list[0].id;
    select.value = String(chosenId);
    return chosenId;
  }

  function wireControls() {
    var search = document.getElementById("candidate-search");
    var select = document.getElementById("candidate-select");

    search.addEventListener("input", function () {
      var q = search.value.trim().toLowerCase();
      var filtered = candidates.filter(function (c) { return c.nome.toLowerCase().indexOf(q) !== -1; });
      var chosenId = populateSelect(filtered, select.value);
      if (chosenId != null) selectCandidate(chosenId);
    });

    select.addEventListener("change", function () { selectCandidate(select.value); });

    document.getElementById("print-btn").addEventListener("click", function () { window.print(); });
  }

  async function init() {
    try {
      var rows = await loadRows();
      candidates = buildCandidates(rows);
      wireControls();
      var chosenId = populateSelect(candidates, null);
      if (chosenId != null) selectCandidate(chosenId);
      else document.getElementById("candidate-main").innerHTML = '<p class="footnote">Nenhum candidato encontrado no CSV.</p>';
    } catch (err) {
      document.getElementById("candidate-main").innerHTML = '<p class="footnote">Erro ao carregar dados: ' + escapeHtml(err.message) + '</p>';
    }
  }

  init();
})();
</script>
</body>
</html>
