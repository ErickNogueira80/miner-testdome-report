<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel gerencial — Testdome</title>
<link rel="stylesheet" href="static/css/report.css?v=10">
</head>
<body>

<div class="report-header">
  <div class="brand"><img src="static/img/miner-logo-branco.svg" alt="Miner"></div>
  <div class="title-block">
    <div class="eyebrow">Avaliação técnica</div>
    <div class="title">Resultado de avaliação de candidato</div>
  </div>
</div>

<div class="print-header">
  <img src="static/img/miner-logo-petroleo.svg" alt="Miner">
</div>

<div class="shell">
  <aside class="side-nav">
    <nav class="side-nav-links">
      <a href="gerencial.html" class="side-nav-link active">Painel gerencial</a>
      <a href="index.html" class="side-nav-link">Avaliações individuais</a>
    </nav>
  </aside>

  <div class="page" id="page-content">
    <p class="footnote">Carregando dados...</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="static/js/testdome-data.js?v=2"></script>
<script src="static/js/charts.js?v=2"></script>
<script>
(function () {
  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function render(kpi, avaliadosPorTeste, avaliadosPorPeriodo, pontuacaoPorTeste, pontuacaoPorConhecimento) {
    var periodoLabels = avaliadosPorPeriodo.map(function (p) { return p[0]; });
    var periodoValues = avaliadosPorPeriodo.map(function (p) { return p[1]; });

    var html =
      '<div class="kpi-row">' +
        '<div class="card"><p class="label">Candidatos avaliados</p><p class="value">' + kpi.candidatos_avaliados + '</p></div>' +
        '<div class="card"><p class="label">Avaliações disponíveis</p><p class="value">' + kpi.avaliacoes_disponiveis + '</p></div>' +
        '<div class="card"><p class="label">Pontuação média</p><p class="value"><span class="pill pill-lg ' + scoreTone(kpi.pontuacao_media) + '">' + kpi.pontuacao_media + '%</span></p></div>' +
        '<div class="card"><p class="label">Avaliações por IA</p><p class="value">' + kpi.avaliacoes_ia + '</p></div>' +
        '<div class="card"><p class="label">Tempo médio de avaliação</p><p class="value">' + kpi.tempo_medio + '</p></div>' +
      '</div>' +
      '<div class="chart-grid">' +
        '<div class="chart-card"><p class="chart-title">Avaliados por teste</p>' + horizontalBarSvg(avaliadosPorTeste, "") + '</div>' +
        '<div class="chart-card"><p class="chart-title">Avaliados por período</p>' + lineAreaSvg(periodoLabels, periodoValues) + '</div>' +
        '<div class="chart-card"><p class="chart-title">Pontuação por teste</p>' + verticalBarSvg(pontuacaoPorTeste, "%") + '</div>' +
        '<div class="chart-card"><p class="chart-title">Pontuação por conhecimento técnico</p>' + horizontalBarSvg(pontuacaoPorConhecimento, "%") + '</div>' +
      '</div>' +
      '<p class="footnote">Dados agregados do TestDome, extraídos automaticamente do CSV publicado em docs/data/testdome_respostas.csv.</p>';

    document.getElementById("page-content").innerHTML = html;
  }

  async function init() {
    try {
      var rows = await loadRows();
      var candidates = buildCandidates(rows);
      var g = buildGerencial(rows, candidates);
      render(g.kpi, g.avaliadosPorTeste, g.avaliadosPorPeriodo, g.pontuacaoPorTeste, g.pontuacaoPorConhecimento);
    } catch (err) {
      document.getElementById("page-content").innerHTML = '<p class="footnote">Erro ao carregar dados: ' + escapeHtml(err.message) + '</p>';
    }
  }

  init();
})();
</script>
</body>
</html>
